spring:
  application:
    name: fixloop-api
  datasource:
    # Server-side JDBC only. Do not put the password or SSL options in the URL.
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:4}
      data-source-properties:
        # pgJDBC verifies both the issuing CA and the server hostname.
        sslmode: verify-full
        sslrootcert: ${DATABASE_SSL_ROOT_CERT:/run/secrets/supabase-ca.crt}
        "[ApplicationName]": fixloop-api
  flyway:
    # The hosted schema predates this app's Flyway history. Do not change it
    # automatically. Tests opt in only for their disposable database.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  servlet:
    multipart:
      # Slightly above the storage limit so the policy, not the container,
      # decides what is too large and answers in the project's error shape.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

fixloop:
  auth:
    # The `iss` claim. Keep this a URI: Spring parses it as a URL.
    issuer: ${JWT_ISSUER:https://fixloop.local}
    # Access tokens are short-lived; refresh tokens rotate on every use.
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P14D}
    # No default on purpose. Without it the API logs in users with an
    # ephemeral key that changes on every restart: fine locally, not deployed.
    jwt-secret: ${JWT_SECRET:}
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:bmu.edu.in}
    registration-enabled: ${REGISTRATION_ENABLED:true}
    rate-limit-enabled: ${RATE_LIMIT_ENABLED:true}
    # Only true behind a trusted reverse proxy that sets X-Forwarded-For.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  web:
    # Comma-separated origins for the Flutter web build, e.g. https://fixloop.example
    allowed-origins: ${ALLOWED_WEB_ORIGINS:}
  storage:
    # A deployment must point this at a persistent volume: a container's
    # temporary directory disappears with the container.
    root: ${ATTACHMENT_STORAGE_DIR:}
    max-bytes: ${ATTACHMENT_MAX_BYTES:8388608}
