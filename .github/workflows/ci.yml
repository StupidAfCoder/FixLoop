name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      # Disposable CI database only; never use this password for real data.
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: '55432'
      API_PORT: '18080'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Unit and PostgreSQL integration tests
        run: mvn --batch-mode --no-transfer-progress -f apps/api/pom.xml verify
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          MINIO_ROOT_USER=ci-only-user MINIO_ROOT_PASSWORD=ci-only-password \
            docker compose -f docker-compose.yml -f infra/compose-tools.yml config --quiet
      - name: Build the API container
        run: docker compose build api
      - name: Start and check the local stack
        run: |
          docker compose up -d --wait --wait-timeout 180 db api
          curl --fail --silent --show-error http://127.0.0.1:18080/actuator/health
      - name: Check that local reference data is repeatable
        run: |
          for attempt in 1 2; do
            docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < infra/seed/seed.sql
          done
          count=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM categories"')
          test "$count" = 2
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the disposable CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Generate Android and web host projects
        run: flutter create --no-pub --platforms=android,web --project-name fixloop_mobile --org com.fixloop .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
